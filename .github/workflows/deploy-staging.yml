name: Deploy staging application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-staging.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Create cloud resources and configure Resend DNS
        run: node scripts/bootstrap-cloud.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Configure encrypted Worker secret
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
      - name: Deploy staging Worker
        run: npx wrangler deploy
