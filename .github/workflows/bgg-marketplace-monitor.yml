name: BGG Marketplace code tests (runtime moved to Apify)

on:
  pull_request:
    paths:
      - "marketplace-monitor/**"
      - ".github/workflows/bgg-marketplace-monitor.yml"
  push:
    branches: ["main"]
    paths:
      - "marketplace-monitor/*.mjs"
      - "marketplace-monitor/*.test.mjs"
      - ".github/workflows/bgg-marketplace-monitor.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: node --test marketplace-monitor/*.test.mjs

