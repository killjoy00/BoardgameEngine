name: BGG Marketplace monitor

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "marketplace-monitor/**"
      - ".github/workflows/bgg-marketplace-monitor.yml"
  push:
    branches: ["main", "feat/bgg-marketplace-monitor"]
    paths:
      - "marketplace-monitor/*.mjs"
      - "marketplace-monitor/*.test.mjs"
      - ".github/workflows/bgg-marketplace-monitor.yml"

permissions:
  contents: read

concurrency:
  group: bgg-marketplace-monitor
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: node --test marketplace-monitor/*.test.mjs

  monitor:
    needs: test
    # A reviewed main-branch source merge can restore missing snapshots without
    # waiting on an unreliable GitHub cron. Data-only bot commits do not match
    # the paths above, avoiding a deployment loop.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      BGG_USERNAME: killjoy00
      MAX_QUERIES_PER_RUN: "12"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Refresh approved BGG wishlist (without logging tokens)
        id: bgg_sync
        run: |
          if [ -z "$BGG_API_TOKEN" ]; then
            echo "::error::Missing BGG_API_TOKEN for approved XML API2 integration"
            exit 1
          fi
          node marketplace-monitor/sync-wishlist.mjs
      - name: Publish dynamic Marketplace search plan for ChatGPT MCP
        id: plan
        run: node marketplace-monitor/plan-queries.mjs
      - name: Search Apify for newly listed games
        # Don't make paid Marketplace requests just to repair BGG data on a push.
        if: env.APIFY_API_TOKEN != '' && github.event_name == 'schedule'
        run: node marketplace-monitor/monitor.mjs
      - name: Report missing one-time Apify credential
        if: env.APIFY_API_TOKEN == ''
        run: echo "::warning::Configure APIFY_API_TOKEN in GitHub Actions repository secrets to enable continuous Marketplace scanning"
      - name: Persist wishlist and scan state for the next run
        # Snapshot writes must survive a later, unrelated Apify scanning failure.
        if: ${{ always() && steps.bgg_sync.outcome == 'success' && steps.plan.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace-monitor/data
          if git diff --cached --quiet; then
            echo "No data changes to save"
          else
            git commit -m "chore: persist BGG marketplace wishlist and scan state [skip ci]"
            git push origin HEAD:main
          fi
