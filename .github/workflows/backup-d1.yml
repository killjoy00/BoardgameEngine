name: Backup D1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Resolve D1 database
        run: |
          DATABASE_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const db=JSON.parse(s).find(x=>x.name==='boardgameengine');if(!db)process.exit(1);process.stdout.write(db.uuid)})")
          sed -i "s/replace-after-running-wrangler-d1-create/$DATABASE_ID/" wrangler.toml
      - name: Export D1
        run: npx wrangler d1 export DB --remote --output ../backup.sql
      - uses: actions/upload-artifact@v4
        with:
          name: boardgameengine-d1-${{ github.run_id }}
          path: backup.sql
          retention-days: 30
